<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento — Biblioteca Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">BIBLIOTECA<small>DIGITAL · TERMINAL</small></a>
  <nav class="nav">
    <a href="index.html">Início</a>
    <a href="atendimento.html" class="ativo">Atendimento</a>
    <a href="catalogo.html">Catálogo</a>
  </nav>
  <div class="clock"><div id="relogio">--:--</div><div id="data-atual"></div></div>
</header>
<main>
  <p id="mensagem-boas-vindas" class="welcome"></p>
  <div class="layout">
    <div class="stack">
      <section class="card">
        <div class="status-row">
          <span class="status-dot"></span><span id="estado-sistema">Em pausa</span>
          <span id="ai-status" class="badge status-waiting">Desativada</span>
        </div>
        <div class="camera">
          <div id="webcam-container"><div id="camera-placeholder">📷<br>A câmera está desligada</div></div>
          <div class="scan-indicator"></div>
        </div>
        <p id="texto-scanner" class="scan-text">Câmera desativada</p>
        <p id="status-leitura" class="mut"></p>
        <button id="btn-camera" class="btn block" type="button" style="margin-top:12px">Ativar câmera</button>
      </section>

      <section id="card-livro" class="card hidden">
        <div class="livro">
          <span id="livro-capa">📖</span>
          <div>
            <span id="livro-area" class="tag"></span> · <span id="livro-categoria" class="tag"></span>
            <h2 id="livro-titulo"></h2>
            <div id="livro-autor" class="mut"></div>
          </div>
        </div>
        <p id="livro-sinopse"></p>
        <div id="livro-status" class="loan-status"></div>
      </section>
    </div>

    <aside class="stack">
      <section class="card">
        <p class="kicker">Atendimento atual</p>
        <div class="contador" id="contador-volumes">0</div>
        <div class="bar"><div id="progresso-sessao"></div></div>
        <p id="texto-contador" class="mut"></p>
        <h3 style="margin-top:18px">Histórico da sessão <span id="total-historico" class="badge">0 livros</span></h3>
        <ul id="lista-historico" class="history"></ul>
        <button id="btn-finalizar" class="btn block" type="button" disabled>Finalizar e emitir comprovante</button>
      </section>
    </aside>
  </div>
</main>

<div id="modal-comprovante" class="modal hidden">
  <div class="modal-conteudo">
    <p class="kicker">Biblioteca Digital</p>
    <h2>Comprovante de Empréstimo</h2>
    <p>Sessão: <strong id="recibo-id"></strong><br>Data: <span id="recibo-data"></span><br>Total de livros: <span id="recibo-qtd"></span></p>
    <ul id="recibo-livros"></ul>
    <div id="qrcode-container"></div>
    <div class="btns">
      <button id="btn-imprimir" class="btn sec" type="button">Imprimir</button>
      <button id="btn-nova-sessao" class="btn" type="button">Novo atendimento</button>
      <button id="btn-fechar-modal" class="btn sec" type="button">Fechar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
</body>
</html>
